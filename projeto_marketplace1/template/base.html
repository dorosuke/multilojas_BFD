<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MultiLojas{% endblock %}</title>
    <style>
        :root {
            --bg: #f5efe4;
            --surface: rgba(255, 251, 245, 0.88);
            --surface-strong: #fffdf8;
            --text: #2c241d;
            --muted: #6f6257;
            --line: rgba(95, 71, 53, 0.15);
            --brand: #c45c2f;
            --brand-dark: #7f3214;
            --brand-soft: #f3d8c8;
            --success: #236b4f;
            --danger: #b23a32;
            --shadow: 0 20px 40px rgba(83, 53, 29, 0.12);
            --radius-lg: 28px;
            --radius-md: 18px;
            --radius-sm: 12px;
            --max-width: 1120px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 205, 150, 0.75), transparent 30%),
                radial-gradient(circle at right, rgba(209, 122, 81, 0.28), transparent 26%),
                linear-gradient(180deg, #fcf6ed 0%, #f2eadc 100%);
            min-height: 100vh;
        }

        a {
            color: inherit;
        }

        .shell {
            width: min(calc(100% - 32px), var(--max-width));
            margin: 0 auto;
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(16px);
            background: rgba(252, 246, 237, 0.78);
            border-bottom: 1px solid rgba(95, 71, 53, 0.08);
        }

        .site-header-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 18px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-mark {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--brand), #e79f5d);
            color: white;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        .brand-text strong,
        .brand-text span {
            display: block;
        }

        .brand-text span {
            color: var(--muted);
            font-size: 0.92rem;
        }

        .nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav a,
        .nav button,
        .button,
        button {
            appearance: none;
            border: 0;
            text-decoration: none;
            font: inherit;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        }

        /* Hamburger e Sidebar (mobile) */
        .hamburger {
            --hamburger-size: 44px;
            --hamburger-thickness: 4px;
            --hamburger-gap: 20px;
            --hamburger-color: var(--text);
            --hamburger-active-color: var(--brand-dark);

            display: inline-flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: var(--hamburger-size);
            height: calc(var(--hamburger-thickness) * 3 + var(--hamburger-gap) * 2);
            background: transparent;
            border: none;
            padding: 4px;
            margin-left: 6px;
            cursor: pointer;
        }
        .hamburger span {
            display: block;
            width: 100%;
            height: var(--hamburger-thickness);
            background: var(--hamburger-color);
            border-radius: 8px;
            transition: transform 260ms cubic-bezier(.2,.9,.3,1), opacity 200ms, background 200ms;
            transform-origin: center;
        }
        .hamburger:focus { outline: 3px solid rgba(0,0,0,0.06); border-radius: 6px }
        .hamburger[aria-expanded="true"] span:nth-child(1) {
            transform: translateY(calc(var(--hamburger-thickness) + var(--hamburger-gap))) rotate(45deg);
            background: var(--hamburger-active-color);
        }
        .hamburger[aria-expanded="true"] span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0.2);
        }
        .hamburger[aria-expanded="true"] span:nth-child(3) {
            transform: translateY(calc(-1 * (var(--hamburger-thickness) + var(--hamburger-gap)))) rotate(-45deg);
            background: var(--hamburger-active-color);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            z-index: 95;
            pointer-events: none;
        }
        .sidebar-overlay.open { opacity: 1; visibility: visible; pointer-events: auto }

        .sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100vh;
            background: var(--surface-strong);
            box-shadow: 2px 0 24px rgba(0,0,0,0.12);
            padding: 20px;
            transition: left 0.25s ease;
            z-index: 100;
            pointer-events: none;
        }
        .sidebar.open { left: 0; pointer-events: auto }
        .sidebar-close { background: transparent; border: 0; font-size: 28px; position: absolute; top: 8px; right: 8px; cursor: pointer }
        .sidebar-nav { margin-top: 36px }
        .sidebar-nav ul { list-style: none; padding: 0; margin: 0 }
        .sidebar-nav li { margin-bottom: 16px }
        .sidebar-nav a { text-decoration: none; color: var(--brand-dark); font-weight: 700 }

        .nav a,
        .nav button {
            padding: 11px 14px;
            border-radius: 999px;
            color: var(--muted);
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid transparent;
        }

        .nav a:hover,
        .nav button:hover,
        .button:hover,
        button:hover {
            transform: translateY(-1px);
        }

        .button,
        button {
            padding: 13px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--brand), #e18a56);
            color: white;
            box-shadow: 0 14px 28px rgba(167, 83, 47, 0.22);
        }

        .button.secondary,
        button.secondary {
            color: var(--brand-dark);
            background: var(--brand-soft);
            box-shadow: none;
        }

        .button.ghost,
        button.ghost {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--line);
            box-shadow: none;
        }

        .page {
            padding: 34px 0 56px;
        }

        .hero-card,
        .card,
        .box,
        .item {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: var(--shadow);
            border-radius: var(--radius-lg);
        }

        .hero-card {
            overflow: hidden;
            padding: 34px;
            position: relative;
        }

        .hero-card::after {
            content: "";
            position: absolute;
            inset: auto -50px -50px auto;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(228, 153, 99, 0.35), transparent 65%);
        }

        .card,
        .box {
            padding: 26px;
        }

        .section {
            margin-top: 24px;
        }

        .section-title {
            margin: 0 0 12px;
            font-size: 1.4rem;
        }

        .muted {
            color: var(--muted);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--brand-dark);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .item {
            padding: 20px;
        }

        .stats {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .stat {
            padding: 18px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(95, 71, 53, 0.08);
        }

        .stat strong {
            display: block;
            font-size: 1.35rem;
            margin-top: 6px;
        }

        .form-grid {
            display: grid;
            gap: 16px;
        }

        .form-grid.two-col {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        label {
            display: grid;
            gap: 8px;
            font-weight: 600;
            font-size: 0.96rem;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            padding: 14px 15px;
            font: inherit;
            color: var(--text);
        }

        textarea {
            min-height: 116px;
            resize: vertical;
        }

        .inline-actions,
        .actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .split {
            display: grid;
            gap: 24px;
            grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
            align-items: start;
        }

        .tabs {
            display: inline-grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            padding: 8px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(95, 71, 53, 0.08);
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 16px;
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            text-align: center;
        }

        .tab.active {
            background: linear-gradient(135deg, var(--brand), #e18a56);
            color: white;
        }

        .status,
        .feedback {
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid transparent;
            font-size: 0.95rem;
            white-space: pre-line;
        }

        .status.info,
        .feedback.info {
            background: rgba(255, 255, 255, 0.72);
            border-color: rgba(95, 71, 53, 0.08);
        }

        .status.success,
        .feedback.success {
            background: rgba(35, 107, 79, 0.1);
            border-color: rgba(35, 107, 79, 0.25);
            color: var(--success);
        }

        .status.error,
        .feedback.error {
            background: rgba(178, 58, 50, 0.09);
            border-color: rgba(178, 58, 50, 0.22);
            color: var(--danger);
        }

        .hidden {
            display: none !important;
        }

        .list-clean {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 12px;
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.74);
            border: 1px solid rgba(95, 71, 53, 0.08);
            color: var(--muted);
            font-size: 0.92rem;
        }

        .kicker {
            color: var(--brand-dark);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-size: 0.78rem;
        }

        .small {
            font-size: 0.86rem;
        }

        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: block;
            max-width: 100%;
        }

        .store-head {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .store-logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(95, 71, 53, 0.12);
            display: grid;
            place-items: center;
            font-weight: 700;
            color: var(--muted);
            flex: 0 0 auto;
        }

        .store-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 6px 2px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .carousel-wrap {
            position: relative;
        }

        .carousel-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(95, 71, 53, 0.18);
            color: var(--brand-dark);
            box-shadow: 0 12px 24px rgba(83, 53, 29, 0.16);
            display: grid;
            place-items: center;
            z-index: 10;
        }

        .carousel-arrow.left {
            left: -10px;
        }

        .carousel-arrow.right {
            right: -10px;
        }

        .carousel-arrow:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: translateY(-50%);
        }

        .carousel-item {
            scroll-snap-align: start;
            flex: 0 0 auto;
            width: 260px;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(95, 71, 53, 0.12);
            border-radius: var(--radius-md);
            padding: 14px;
        }

        .carousel-item-sm {
            width: 120px;
            padding: 10px;
        }

        .thumb {
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(95, 71, 53, 0.10);
            display: grid;
            place-items: center;
            aspect-ratio: 4 / 3;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-sm {
            width: 84px;
            height: 64px;
            aspect-ratio: auto;
            border-radius: 14px;
            flex: 0 0 auto;
        }

        .product-hero {
            aspect-ratio: 4 / 3;
        }

        .meta {
            margin-top: 10px;
            display: grid;
            gap: 6px;
        }

        .meta-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
        }

        .price {
            font-weight: 800;
            color: var(--text);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            border: 1px solid rgba(95, 71, 53, 0.12);
            background: rgba(255, 255, 255, 0.72);
            color: var(--muted);
            white-space: nowrap;
        }

        .badge.ok {
            background: rgba(35, 107, 79, 0.10);
            border-color: rgba(35, 107, 79, 0.25);
            color: var(--success);
        }

        .badge.warn {
            background: rgba(196, 92, 47, 0.12);
            border-color: rgba(196, 92, 47, 0.25);
            color: var(--brand-dark);
        }

        .product-layout {
            display: grid;
            gap: 18px;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: start;
        }

        .store-product {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        #toast-root {
            position: fixed;
            right: 20px;
            bottom: 20px;
            display: grid;
            gap: 10px;
            z-index: 40;
        }

        .toast {
            min-width: 240px;
            max-width: 360px;
            padding: 14px 16px;
            border-radius: 16px;
            color: white;
            box-shadow: var(--shadow);
            animation: slideUp 0.24s ease;
        }

        .toast.info {
            background: #5f4735;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .site-header-inner,
            .split,
            .form-grid.two-col {
                grid-template-columns: 1fr;
                display: grid;
            }

            .site-header-inner {
                justify-content: stretch;
            }

            .nav {
                justify-content: flex-start;
            }
        }

        @media (max-width: 640px) {
            .shell {
                width: min(calc(100% - 20px), var(--max-width));
            }

            .page {
                padding-top: 20px;
            }

            .hero-card,
            .card,
            .box,
            .item {
                border-radius: 22px;
            }

            .hero-card,
            .card,
            .box {
                padding: 20px;
            }

            .nav a,
            .nav button {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
        }

        /* Sidebar layout */
        .app-shell {
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .sidebar {
            position: sticky;
            top: 18px;
            align-self: start;
            border: 1px solid rgba(95, 71, 53, 0.12);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.82);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }

        .sidebar .nav {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }

        .sidebar .nav a,
        .sidebar .nav button {
            justify-content: flex-start;
            width: 100%;
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .sidebar-title strong {
            font-size: 0.95rem;
        }

        .sidebar-toggle {
            display: none;
            border: 1px solid rgba(95, 71, 53, 0.14);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 14px;
            padding: 10px 12px;
            font-weight: 700;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease;
            z-index: 40;
        }

        body.sidebar-open .sidebar-overlay {
            opacity: 1;
            pointer-events: auto;
        }

        @media (max-width: 980px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .sidebar-toggle {
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            .sidebar {
                position: fixed;
                left: 12px;
                top: 12px;
                bottom: 12px;
                width: min(340px, calc(100% - 24px));
                overflow: auto;
                z-index: 50;
                transform: translateX(-120%);
                transition: transform 220ms ease;
            }

            body.sidebar-open .sidebar {
                transform: translateX(0);
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="sidebar-overlay" data-sidebar-overlay></div>
		    <header class="site-header">
		        <div class="shell site-header-inner">
		            <a class="brand" href="/">
		                <span class="brand-mark">ML</span>
                <span class="brand-text">
                    <strong>MultiLojas</strong>
                    <span>Marketplace para pequenos empreendedores</span>
		                </span>
		            </a>

                <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Abrir menu">
                    ☰ Menu
                </button>
		        </div>
		    </header>

		    <main class="page">
		        <div class="shell">
	                <div class="app-shell">
	                    <aside class="sidebar" aria-label="Menu lateral">
	                        <div class="sidebar-title">
	                            <strong>Navegação</strong>
	                            <button type="button" class="ghost" data-sidebar-close aria-label="Fechar menu">✕</button>
	                        </div>
	                        <nav class="nav">
	                            <a href="/">Inicio</a>
	                            <a href="/api/front/busca/">Buscar</a>
	                            <a href="/api/front/cadastro/">Cadastro</a>
	                            <a href="/api/front/login/" data-guest-link>Login</a>
	                            <a href="/api/front/recuperar-senha/" data-guest-link>Recuperar senha</a>
	                            <a href="/api/front/perfil/" data-auth-link class="hidden">Perfil</a>
	                            <a href="/api/front/vendedor/" data-seller-link class="hidden">Painel vendedor</a>
	                            <a href="/api/front/minha-loja/" data-seller-link class="hidden">Minha loja</a>
	                            <a href="/api/front/meus-produtos/" data-seller-link class="hidden">Meus produtos</a>
	                            <a href="/api/front/admin/" data-admin-link class="hidden">Painel admin</a>
	                            <button type="button" class="ghost hidden" data-logout-button>Sair</button>
	                        </nav>
	                    </aside>

	                    <section class="min-w-0">
	                        {% block content %}{% endblock %}
	                    </section>
	                </div>
		        </div>
		    </main>

    <div id="toast-root" aria-live="polite" aria-atomic="true"></div>

	    <script>
	        window.MarketplaceApp = (() => {
            const storageKeys = {
                access: 'marketplace.access',
                refresh: 'marketplace.refresh',
                user: 'marketplace.user',
            };

            const getAccessToken = () => localStorage.getItem(storageKeys.access);
            const getRefreshToken = () => localStorage.getItem(storageKeys.refresh);

            const getStoredUser = () => {
                const raw = localStorage.getItem(storageKeys.user);
                if (!raw) {
                    return null;
                }
                try {
                    return JSON.parse(raw);
                } catch (error) {
                    return null;
                }
            };

            const saveAuth = (payload) => {
                localStorage.setItem(storageKeys.access, payload.access);
                localStorage.setItem(storageKeys.refresh, payload.refresh);
                localStorage.setItem(storageKeys.user, JSON.stringify(payload.user));
                hydrateNav();
            };

            const clearAuth = () => {
                localStorage.removeItem(storageKeys.access);
                localStorage.removeItem(storageKeys.refresh);
                localStorage.removeItem(storageKeys.user);
                hydrateNav();
            };

            const normalizeError = (data) => {
                const fieldLabels = {
                    nome: 'Nome',
                    email: 'E-mail',
                    senha: 'Senha',
                    telefone: 'Telefone',
                    nome_loja: 'Nome da loja',
                    descricao_loja: 'Descricao da loja',
                    logo_url: 'Logo da loja',
                    endereco_completo: 'Endereco completo',
                    endereco_completo_vendedor: 'Endereco da loja',
                    endereco_completo_comprador: 'Endereco de entrega',
                    cnpj: 'CNPJ ou CPF',
                    chave_pix: 'Chave PIX',
                    cpf: 'CPF',
                    uid: 'Identificador',
                    token: 'Token',
                    nova_senha: 'Nova senha',
                    non_field_errors: 'Formulario',
                    detail: 'Detalhe',
                };

                const formatEntry = (key, value) => {
                    const label = fieldLabels[key] || key;
                    return `${label}: ${value}`;
                };

                if (!data) {
                    return 'Nao foi possivel concluir a operacao.';
                }
                if (typeof data === 'string') {
                    return data;
                }
                if (data.message) {
                    return data.message;
                }
                const detail = data.detail;
                if (typeof detail === 'string') {
                    return detail;
                }
                const values = [];
                const source = data.errors || data;
                Object.entries(source).forEach(([key, value]) => {
                    if (Array.isArray(value)) {
                        values.push(formatEntry(key, value.join(' ')));
                    } else if (typeof value === 'string') {
                        values.push(formatEntry(key, value));
                    } else if (value && typeof value === 'object') {
                        values.push(formatEntry(key, normalizeError(value)));
                    }
                });
                return values.filter(Boolean).join('\n') || 'Revise os dados enviados.';
            };

            const showToast = (message, type = 'info') => {
                const root = document.getElementById('toast-root');
                if (!root) {
                    return;
                }
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                root.appendChild(toast);
                window.setTimeout(() => {
                    toast.remove();
                }, 3600);
            };

            const setFeedback = (element, message, type = 'info') => {
                if (!element) {
                    return;
                }
                element.className = `feedback ${type}`;
                element.textContent = message;
                element.classList.remove('hidden');
            };

            const hideFeedback = (element) => {
                if (!element) {
                    return;
                }
                element.className = 'feedback hidden';
                element.textContent = '';
            };

            const apiFetch = async (url, options = {}) => {
                const headers = {
                    'Content-Type': 'application/json',
                    ...(options.headers || {}),
                };
                const token = getAccessToken();
                if (options.auth !== false && token) {
                    headers.Authorization = `Bearer ${token}`;
                }

                const response = await fetch(url, {
                    ...options,
                    headers,
                });

                let data = null;
                try {
                    data = await response.json();
                } catch (error) {
                    data = null;
                }

                if (!response.ok || (data && data.success === false)) {
                    throw new Error(normalizeError(data));
                }

                return data;
            };

            const hydrateNav = () => {
                const authenticated = Boolean(getAccessToken());
                const user = getStoredUser();
                const isSeller = user && user.user && user.user.tipo === 'vendedor';
                const isAdmin = user && user.user && (user.user.is_staff || user.user.is_superuser);
                document.querySelectorAll('[data-auth-link]').forEach((element) => {
                    element.classList.toggle('hidden', !authenticated);
                });
                document.querySelectorAll('[data-guest-link]').forEach((element) => {
                    element.classList.toggle('hidden', authenticated);
                });
                document.querySelectorAll('[data-seller-link]').forEach((element) => {
                    element.classList.toggle('hidden', !authenticated || !isSeller);
                });
                document.querySelectorAll('[data-admin-link]').forEach((element) => {
                    element.classList.toggle('hidden', !authenticated || !isAdmin);
                });
                document.querySelectorAll('[data-logout-button]').forEach((element) => {
                    element.classList.toggle('hidden', !authenticated);
                });
            };

            const requireAuth = (redirectTo = '/api/front/login/') => {
                if (!getAccessToken()) {
                    window.location.href = redirectTo;
                    return false;
                }
                return true;
            };

            document.addEventListener('click', (event) => {
                const button = event.target.closest('[data-logout-button]');
                if (!button) {
                    return;
                }
                clearAuth();
                showToast('Sessao encerrada com sucesso.', 'success');
                if (window.location.pathname === '/api/front/perfil/') {
                    window.location.href = '/api/front/login/';
                }
            });

            document.addEventListener('DOMContentLoaded', hydrateNav);

            return {
                apiFetch,
                clearAuth,
                getAccessToken,
                getRefreshToken,
                getStoredUser,
                hideFeedback,
                normalizeError,
                requireAuth,
                saveAuth,
                setFeedback,
                showToast,
            };
        })();

        const initCarousels = () => {
            document.querySelectorAll('.carousel').forEach((carousel) => {
                if (carousel.dataset.withControls === '1') {
                    return;
                }
                carousel.dataset.withControls = '1';

                const wrap = document.createElement('div');
                wrap.className = 'carousel-wrap';

                const left = document.createElement('button');
                left.type = 'button';
                left.className = 'carousel-arrow left';
                left.setAttribute('aria-label', 'Anterior');
                left.innerHTML = '&#x2039;';

                const right = document.createElement('button');
                right.type = 'button';
                right.className = 'carousel-arrow right';
                right.setAttribute('aria-label', 'Próximo');
                right.innerHTML = '&#x203A;';

                const parent = carousel.parentNode;
                parent.insertBefore(wrap, carousel);
                wrap.appendChild(left);
                wrap.appendChild(carousel);
                wrap.appendChild(right);

                const scrollAmount = () => Math.max(240, Math.floor(carousel.clientWidth * 0.85));
                left.addEventListener('click', () => {
                    carousel.scrollBy({ left: -scrollAmount(), behavior: 'smooth' });
                });
                right.addEventListener('click', () => {
                    carousel.scrollBy({ left: scrollAmount(), behavior: 'smooth' });
                });

                const update = () => {
                    const max = carousel.scrollWidth - carousel.clientWidth;
                    left.disabled = carousel.scrollLeft <= 4;
                    right.disabled = carousel.scrollLeft >= max - 4;
                };
                carousel.addEventListener('scroll', update, { passive: true });
                window.addEventListener('resize', update);
                update();
            });
        };

        document.addEventListener('DOMContentLoaded', initCarousels);

        const initSidebar = () => {
            const open = () => document.body.classList.add('sidebar-open');
            const close = () => document.body.classList.remove('sidebar-open');

            document.querySelectorAll('[data-sidebar-toggle]').forEach((btn) => btn.addEventListener('click', open));
            document.querySelectorAll('[data-sidebar-close]').forEach((btn) => btn.addEventListener('click', close));
            document.querySelectorAll('[data-sidebar-overlay]').forEach((el) => el.addEventListener('click', close));
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') close();
            });
        };

        document.addEventListener('DOMContentLoaded', initSidebar);
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
